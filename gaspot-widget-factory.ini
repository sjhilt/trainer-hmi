# Widget Factory configuration for the local GasPot dependency.
#
# Keep GasPot itself as a local clone under ./GasPot and keep project-specific
# trainer changes in this file so we do not modify your real GasPot checkout.
# Setup if ./GasPot is missing:
#   git clone https://github.com/sjhilt/GasPot.git GasPot

[host]
tcp_ip = 0.0.0.0
tcp_port = 10001
buffer_size = 1024

[products]
product1 = WIDGET FEED
product2 = COOLANT
product3 = PAINT MIX
product4 = FINISHED LOT

[stations]
list = [
    'WIDGET FACTORY\n    PROCESS TRAIN A\n    TRAINER LAB',
    'WIDGET FACTORY - ACCUMULATOR CELL',
    'WIDGET FACTORY - PROCESS UTILITIES',
    'WIDGET FACTORY - QC RETURN SYSTEM', ]

[parameters]
decimal_separator = .
low_temperature = 50
high_temperature = 60
min_h2o = 0
max_h2o = 9
min_height = 25
max_height = 75
min_vol = 1000
max_vol = 9050
min_ullage = 3000
max_ullage = 9999

[consumption]
enabled = true
gallons_per_hour = 80
delivery_threshold = 20
delivery_fill_to = 85
